name: Validate financial changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated database test dependency
        run: npm --prefix tests/database install --ignore-scripts --no-audit --no-fund
      - name: Test database compatibility and access
        run: npm --prefix tests/database test
